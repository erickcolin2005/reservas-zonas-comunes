# La demo publica, declarada. No son clics en un panel.
#
# Un despliegue que solo existe como una secuencia de clics no se puede revisar,
# no se puede repetir y no se puede contar en un README. Este fichero es la
# version pequena de lo que `infra/` hace en AWS, y esta aqui por la misma razon.
#
# POR QUE FUERA DE AWS. La razon esta en §6.1 del README y es economica: el
# instrumento es una superficie de consumo abierta y anunciada a desconocidos, y
# con la cuenta de AWS en Plan de Pago y cero creditos, dejarla viva y
# desatendida alli es el riesgo que este proyecto describio como no acotable con
# codigo. AWS se usa en ventanas cortas y supervisadas, no permanentemente.
#
# ---------------------------------------------------------------------------
# LA MAQUINA, Y QUE SE MIDIO SOBRE ELLA
# ---------------------------------------------------------------------------
# El plan gratuito da 512 MB y 0.1 CPU. Esa forma exacta esta medida en
# `evidencia/contenedor-en-una-decima-de-cpu.txt`, no supuesta:
#
#   - el instrumento alcanza sus 50 simultaneas: tres corridas, 50 competidoras
#     efectivas, 1 confirmada, y 3/6/7 RR-11. Las tres validas.
#   - los RR-11 caen de 12-16 (a 1 CPU) a 3-7. Sigue habiendo carrera directa
#     observada, que es lo que el criterio exige, pero con menos margen.
#   - el arranque en frio tarda 53-71 s, porque la JVM del motor arranca con una
#     decima de CPU.
#
# ---------------------------------------------------------------------------
# LO QUE HAY QUE SABER ANTES DE ABRIR EL ENLACE
# ---------------------------------------------------------------------------
# El plan gratuito DUERME a los 15 minutos sin trafico. Sumado al arranque de
# arriba, casi todo visitante llega en frio y espera cerca de un minuto. Se
# asume y se declara: es el precio de que la demo no cueste dinero, y el
# entregable de este proyecto nunca fue el enlace -es el IaC y la evidencia-.
#
# Tiene una contrapartida real: el motor va en memoria y `arranque.sh` resiembra
# en cada arranque, asi que dormir devuelve la demo a su estado limpio. Sin eso,
# el segundo visitante encontraria la franja ya reservada por el primero.

services:
  - name: reservas-zonas-comunes
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    # Virginia es la region mas cercana de las que ofrece el plan gratuito
    # (oregon, ohio, virginia, frankfurt, singapore), y coincide con la costa
    # este donde vive la cuenta de AWS.
    region: virginia

    # La rama donde vive I-6. Cambiar esto cuando se fusione a main.
    branch: i6-frontera-http

    # /salud NO toca el motor. Una sonda que leyera la tabla cada pocos segundos
    # convertiria la vigilancia en consumo, y ademas impediria que la instancia
    # llegara a dormir nunca.
    healthCheckPath: /salud

    autoDeployTrigger: commit

    # -----------------------------------------------------------------------
    # LAS OCHO. Ninguna tiene valor por defecto en el codigo, a proposito: un
    # despliegue con una variable mal puesta arrancaria con un valor de
    # demostracion y PARECERIA configurado. Estan explicadas una a una en §6.2
    # del README.
    # -----------------------------------------------------------------------
    envVars:
      # -------------------------------------------------------------------
      # EL PUERTO SE FIJA, Y NO ES UNA PREFERENCIA: ES SEGURIDAD
      # -------------------------------------------------------------------
      # Dentro del contenedor hay DOS puertos abiertos: el 8080 del servidor y
      # el **8000 de DynamoDB Local**, que `arranque.sh` levanta primero.
      #
      # Render escanea puertos y enruta UNO. Su documentacion lo dice: *"if your
      # service does bind to multiple ports, always bind your public HTTP server
      # to the value of the PORT environment variable"*, y declararla impide que
      # exponga los demas. El primer despliegue fallido ya enseno el riesgo en el
      # log: `Detected a new open port HTTP:8000`.
      #
      # Si Render enrutara al 8000, la demo publicaria **el motor de datos en
      # crudo**: cualquiera leeria y escribiria la tabla saltandose el
      # autorizador, el contador y las reglas. Todo el trabajo de SEC-1 y SEC-2
      # se rodearia por un puerto mal adivinado.
      #
      # `test_infra.py` comprueba que esto este puesto y que no coincida con el
      # puerto del motor.
      - key: PORT
        value: "8080"

      - key: RESERVAS_ESPACIOS
        value: E-SAL,E-BBQ,E-CAN

      - key: RESERVAS_VENTANA_SEGUNDOS
        value: "300"

      - key: RESERVAS_TOPE_POR_IDENTIDAD
        value: "5"

      - key: RESERVAS_TOPE_POR_ORIGEN
        value: "20"

      # 250 no es un numero elegido a ojo: el sistema comprueba AL ARRANCAR que
      # `identidades x tope <= capacidad del borde`, y el sembrado crea 50
      # unidades activas. 50 x 5 = 250. Si no se cumple, no arranca — porque el
      # borde rechazaria antes que el contador y la medicion se invalidaria sin
      # que nadie hubiera tocado el contador.
      - key: RESERVAS_CAPACIDAD_DEL_BORDE
        value: "250"

      # D-CE4-1: enfriamiento entre ejecuciones del instrumento, en el borde y
      # no en el cliente, porque un tope en el cliente lo quita quien quiera.
      - key: RESERVAS_ENFRIAMIENTO_SEGUNDOS
        value: "20"

      # Generada por Render, distinta en cada servicio y nunca en el
      # repositorio. Firma las credenciales que presta el dispensador.
      - key: RESERVAS_CLAVE_FIRMA
        generateValue: true

      # -------------------------------------------------------------------
      # LA URL PUBLICA, Y POR QUE AHORA ES UN LITERAL
      # -------------------------------------------------------------------
      # Nacio como `sync: false` -declararla a mano en el panel- porque la URL
      # no se puede saber antes de que el servicio exista: si el nombre esta
      # tomado, Render le anade un sufijo que nadie decide.
      #
      # Ya existe, y es esta. Escribirla aqui es lo que hace cierto lo que §6 del
      # README promete: que el sistema se levanta desde el repositorio y no desde
      # una secuencia de clics que hay que recordar. Un despliegue con un hueco
      # que rellenar a mano no se reconstruye solo, y este proyecto no puede
      # afirmar lo contrario.
      #
      # TIENE QUE COINCIDIR EXACTAMENTE con el dominio del servicio: `https://`,
      # sin barra final. Si el servicio se renombra, esto cambia con el — y si no
      # cambia, EL FALLO NO SE PARECE A SU CAUSA: la pagina carga, se ve entera y
      # no hace nada, porque el navegador bloquea la llamada por CORS y el
      # servidor ni se entera de que alguien lo intento.
      - key: RESERVAS_ORIGEN_PERMITIDO
        value: https://reservas-zonas-comunes.onrender.com
