[pytest]
testpaths = pruebas
# Con esto las pruebas corren igual con `pytest` y con `python -m pytest`.
# No es cosmetico: en el proyecto anterior una importacion que solo funcionaba
# con `python -m pytest` paso la maquina de desarrollo y la caza el CI.
pythonpath = .
addopts = -ra --strict-markers
markers =
    motor: necesita el sustituto local (DynamoDB Local) levantado
    lento: tarda; produce concurrencia real con 50 hilos
filterwarnings =
    error::DeprecationWarning:reservas.*
